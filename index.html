<style>
:root{
  --bg:#faf6ef; --card:#ffffff; --soft:#f1ece2; --line:#e6dfd2;
  --text:#2c2a26; --muted:#7a7468;
  --green:#5f9470; --green-d:#4a7a5a; --green-l:#e3efe5;
  --warm:#d98a5b; --warm-l:#fbeadf; --danger:#c0564b;
  --shadow:0 2px 10px rgba(70,55,30,.07);
}
:root[data-theme=dark]{
  --bg:#1a1d1a; --card:#252925; --soft:#2e332e; --line:#3a403a;
  --text:#eeece6; --muted:#a39f94;
  --green:#86bb95; --green-d:#a4d1b0; --green-l:#2c3b30;
  --warm:#e6a077; --warm-l:#40322a; --danger:#e58278;
  --shadow:0 2px 10px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#1a1d1a; --card:#252925; --soft:#2e332e; --line:#3a403a;
    --text:#eeece6; --muted:#a39f94;
    --green:#86bb95; --green-d:#a4d1b0; --green-l:#2c3b30;
    --warm:#e6a077; --warm-l:#40322a; --danger:#e58278;
    --shadow:0 2px 10px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:1.9rem;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:26px 0 12px}
h3{font-size:1.08rem}
h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
h4 small{text-transform:none;letter-spacing:0;font-weight:400}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.logo{font-weight:700;font-size:1.15rem;white-space:nowrap}
.logo span{color:var(--green)}
nav{display:flex;gap:4px}
nav button{border:0;background:none;cursor:pointer;border-radius:14px;padding:8px 14px;min-height:48px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
nav button.on{background:var(--green-l);color:var(--green-d)}
nav .ni{font-size:1.25rem}
@media (max-width:799px){
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  nav button{flex:1;flex-direction:column;gap:0;font-size:.72rem;padding:6px 2px;min-height:58px;justify-content:center}
}
@media (min-width:800px){body{padding-bottom:40px} nav{margin-left:auto}}
main{max-width:1040px;margin:auto;padding:22px 16px}
.sub{color:var(--muted);margin-top:4px}
header{padding-top:env(safe-area-inset-top)}
.hero{border-radius:26px;background:linear-gradient(135deg,#d9ebdb 0%,#f3ecd9 60%,#fbe3cf 100%);color:#22352a;display:grid;grid-template-columns:1fr;overflow:hidden;box-shadow:var(--shadow)}
.hero svg{width:100%;height:190px;display:block}
.herotxt{padding:0 22px 22px}
.herotxt p{color:#4d6455;margin-top:4px}
.herotag{display:inline-block;background:rgba(255,255,255,.7);border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700;color:#3f7150;margin-bottom:8px}
@media (min-width:640px){.hero{grid-template-columns:1fr 360px;align-items:center}.hero svg{height:230px;order:2}.herotxt{padding:26px 10px 26px 30px}.herotxt h1{font-size:2.3rem}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;min-height:48px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--green)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme=dark] .btn.pri{color:#142017}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{color:#142017}}
.btn.ok{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.btn.warn{color:var(--danger)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem}
.btn.ic{padding:6px;min-width:40px}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:11px;padding:8px 14px;min-height:42px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ricon{width:54px;height:54px;flex:none;border-radius:16px;background:var(--warm-l);display:grid;place-items:center;font-size:1.7rem}
.rhead{display:flex;gap:14px;align-items:center}
.mlabel{font-weight:700;color:var(--green-d);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.meal{display:flex;flex-direction:column;gap:14px}
.meal.done{border-color:var(--green)}
.meal .btn{flex:1}
.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.mini{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mini:first-of-type{border-top:0}
.mini .e{font-size:1.4rem}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.days button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px;cursor:pointer;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.days button small{font-weight:400;font-size:.8rem;color:var(--muted)}
.days button.on{background:var(--green);border-color:var(--green);color:#fff}
.days button.on small{color:#fff}
.days button.today:not(.on){border-color:var(--warm);border-width:2px}
.slot{margin-bottom:16px}
.slot.done{border-color:var(--green)}
.slotbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rcols{display:grid;gap:20px;grid-template-columns:1fr;margin-top:18px}
@media (min-width:700px){.rcols{grid-template-columns:5fr 7fr}}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ings b{font-weight:600;color:var(--green-d);white-space:nowrap}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--green-l);color:var(--green-d);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.rc{cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;text-align:left;width:100%}
.rc:hover{border-color:var(--green)}
.fav{border:0;background:none;cursor:pointer;font-size:1.5rem;line-height:1;padding:8px;color:var(--line);border-radius:12px}
.fav.on{color:var(--warm)}
.rc .fav{position:absolute;top:8px;right:8px}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:150px;resize:vertical}
label.f{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.toolbar input[type=search]{flex:1;min-width:180px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* compra */
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.check{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:transparent;font-weight:700;font-size:1.1rem;padding:0}
.bought .check{background:var(--green);border-color:var(--green);color:#fff}
.bought .sname{text-decoration:line-through;color:var(--muted)}
.sname{flex:1;min-width:0}
.sqty{width:118px!important;min-height:40px!important;padding:6px 10px!important;text-align:right;flex:none}
.sqty.ov{border-color:var(--warm)}
.gtitle{font-weight:700;margin:0 0 6px}
/* modal */
.ov-bg{position:fixed;inset:0;background:rgba(20,20,15,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px 26px}
@media (min-width:700px){.ov-bg{align-items:center;padding:20px}.modal{border-radius:24px;padding:26px}}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.ingrow{display:grid;grid-template-columns:70px 100px 1fr 44px;gap:6px;margin-bottom:6px}
@media (max-width:480px){.ingrow{grid-template-columns:56px 78px 1fr 40px}}
.emo{display:flex;flex-wrap:wrap;gap:4px}
.emo button{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:1.3rem;width:42px;height:42px;cursor:pointer}
.emo button.on{border-color:var(--green);background:var(--green-l)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.note{background:var(--green-l);border-radius:14px;padding:12px 14px;font-size:.92rem}
[hidden]{display:none!important}
</style>
</head>

  <div class="logo">🥗 Nuestro <span>Menú</span></div>

const SEED=[
// ---------- SEMANA 1 ----------
["Tostadas integrales con huevos revueltos y tomate cherry","d",10,"Fácil","🍳","Pan integral:4:rebanadas;Huevos:4:ud;Tomates cherry:150:g;Aceite de oliva;Sal;Pimienta",
 ["Tuesta las rebanadas de pan.","Bate los huevos con una pizca de sal y pimienta.","Calienta un hilo de aceite en una sartén a fuego medio-bajo y cuaja los huevos removiendo suavemente 2-3 minutos, hasta que queden jugosos.","Corta los tomates cherry por la mitad y alíñalos con sal y unas gotas de aceite.","Reparte el revuelto sobre las tostadas y acompaña con los tomates."]],
["Pollo salteado con pimientos y judías verdes","c",20,"Fácil","🍗","Pechuga de pollo:350:g;Pimiento rojo:1:ud;Pimiento verde:1:ud;Judías verdes:250:g;Ajo:1:dientes;Salsa de soja:1:cda;Aceite de oliva;Sal;Pimienta",
 ["Corta el pollo en tiras, los pimientos en bastones y las judías en trozos de 3-4 cm.","Cuece las judías 5 minutos en agua hirviendo con sal y escúrrelas.","Dora el pollo salpimentado en una sartén grande con aceite a fuego fuerte, 4-5 minutos. Resérvalo.","En la misma sartén saltea los pimientos y el ajo picado 4 minutos.","Añade las judías, el pollo y la salsa de soja, saltea 2 minutos más y sirve."]],
["Wrap de huevo, pavo y espinacas","d",10,"Fácil","🌯","Tortillas de avena:2:ud;Huevos:3:ud;Pechuga de pavo en lonchas:4:lonchas;Espinacas frescas:60:g;Aceite de oliva;Sal",

["Tortilla de espinacas y feta con ensalada","c",15,"Fácil","🥬","Huevos:5:ud;Espinacas frescas:150:g;Queso feta:80:g;Ensalada variada:100:g;Tomate:1:ud;Aceite de oliva;Vinagre;Sal",
 ["Saltea las espinacas con un hilo de aceite 2 minutos y escurre el agua que suelten.","Bate los huevos con poca sal (el feta ya es salado) y mezcla con las espinacas y el feta desmenuzado.","Cuaja la mezcla en una sartén antiadherente a fuego medio 3-4 minutos, dale la vuelta con un plato y cocina 2 minutos más.","Aliña la ensalada y el tomate troceado con aceite, vinagre y sal.","Sirve la tortilla en porciones junto a la ensalada."]],
["Yogur griego con fresas y nueces","d",5,"Fácil","🍓","Yogur griego natural:300:g;Fresas:200:g;Nueces:30:g;Miel:2:cdta",
 ["Lava las fresas, quítales el rabito y córtalas en trozos.","Reparte el yogur en dos cuencos.","Añade las fresas y las nueces troceadas por encima, y termina con un hilo de miel si os apetece."]],
["Noodles de arroz con huevo y verduras","c",20,"Fácil","🍜","Noodles de arroz:150:g;Huevos:3:ud;Zanahoria:1:ud;Calabacín:1:ud;Pimiento rojo:1:ud;Ajo:1:dientes;Salsa de soja:2:cda;Aceite de oliva",
 ["Hidrata los noodles en agua caliente según indique el paquete (unos 5 minutos), escúrrelos y pásalos por agua fría.","Corta la zanahoria, el calabacín y el pimiento en tiras finas.","Saltea las verduras con el ajo picado y un poco de aceite a fuego fuerte 5 minutos, que queden crujientes.","Aparta las verduras a un lado, cuaja los huevos batidos en el hueco y trocéalos.","Añade los noodles y la salsa de soja, mezcla todo 1-2 minutos y sirve."]],
["Arepa con perico venezolano","d",25,"Media","🫓","Harina de maíz precocida:150:g;Huevos:4:ud;Tomate:1:ud;Cebolla:0.5:ud;Aceite de oliva;Sal",
 ["Mezcla la harina con unos 275 ml de agua tibia y una pizca de sal. Amasa hasta que no se pegue y deja reposar 3 minutos (añade un poco más de agua o harina si hace falta).","Forma 4 arepas de 1 cm de grosor aproximadamente.","Cocínalas en una sartén o plancha apenas engrasada a fuego medio, 5-6 minutos por lado, hasta que estén doradas y suenen huecas al golpearlas.","Mientras, sofríe la cebolla y el tomate picados con un poco de aceite 4 minutos.","Añade los huevos batidos con sal y remueve hasta que cuajen, jugosos.","Abre las arepas y rellénalas con el perico."]],
["Ensalada de atún, huevo cocido y aguacate","c",15,"Fácil","🥗","Atún al natural:2:latas;Huevos:3:ud;Aguacate:1:ud;Ensalada variada:150:g;Tomates cherry:150:g;Aceite de oliva;Vinagre;Sal",

["Tostadas con aguacate y huevo a la plancha","d",10,"Fácil","🥑","Pan integral:4:rebanadas;Aguacate:1:ud;Huevos:2:ud;Limón:0.5:ud;Aceite de oliva;Sal;Pimienta",

["Omelette de champiñones y mozzarella","d",10,"Fácil","🍄","Huevos:4:ud;Champiñones laminados:150:g;Mozzarella rallada:60:g;Aceite de oliva;Sal;Pimienta",

["Pizza rápida de tortilla de avena","c",15,"Fácil","🍕","Tortillas de avena:2:ud;Tomate triturado:100:g;Mozzarella rallada:100:g;Pechuga de pavo en lonchas:4:lonchas;Champiñones laminados:80:g;Orégano",

["Tortilla de patatas rápida con fruta","d",20,"Media","🥔","Patatas:300:g;Huevos:4:ud;Fruta de temporada:2:ud;Aceite de oliva;Sal",

["Sardinillas con patatas y ensalada","c",25,"Fácil","🐟","Sardinillas en aceite de oliva:2:latas;Patatas:400:g;Ensalada variada:100:g;Tomate:1:ud;Limón:0.5:ud;Aceite de oliva;Vinagre;Sal",

["Revuelto de champiñones y queso con ensalada","c",15,"Fácil","🍄","Huevos:5:ud;Champiñones laminados:250:g;Mozzarella rallada:50:g;Ajo:1:dientes;Ensalada variada:100:g;Aceite de oliva;Vinagre;Sal",

["Chuletas a la plancha con patatas y verduras","c",30,"Fácil","🥩","Chuletas de cerdo:4:ud;Patatas:400:g;Calabacín:1:ud;Pimiento rojo:1:ud;Ajo:1:dientes;Aceite de oliva;Sal;Pimienta",

["Yogur griego con frutos rojos y almendras","d",5,"Fácil","🫐","Yogur griego natural:300:g;Frutos rojos:150:g;Almendras:30:g;Miel:2:cdta",

["Wrap de pollo, lechuga y salsa de yogur","c",20,"Fácil","🌯","Tortillas de avena:2:ud;Pechuga de pollo:300:g;Ensalada variada:80:g;Tomate:1:ud;Yogur griego natural:100:g;Limón:0.5:ud;Aceite de oliva;Sal;Pimienta",

["Tostadas francesas con fresas","d",15,"Fácil","🍞","Pan integral:4:rebanadas;Huevos:2:ud;Leche:100:ml;Fresas:200:g;Yogur griego natural:100:g;Canela;Aceite de oliva",

["Pollo con champiñones y patatas salteadas","c",30,"Fácil","🍗","Pechuga de pollo:350:g;Champiñones laminados:250:g;Patatas:400:g;Ajo:2:dientes;Perejil;Aceite de oliva;Sal;Pimienta",

["Tortitas de maíz con huevo y aguacate","d",10,"Fácil","🌽","Tortitas de maíz:4:ud;Huevos:2:ud;Aguacate:1:ud;Tomates cherry:100:g;Limón:0.5:ud;Sal",

const KEY='nuestroMenu.v1';
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MEAL={d:'☀️ Desayuno',c:'🌙 Cena'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseIso(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fq(q){const w=Math.floor(q),f=Math.round((q-w)*100)/100,fr={0.25:'¼',0.5:'½',0.75:'¾'}[f];
  return fr?(w||'')+fr:String(Math.round(q*100)/100).replace('.',',')}
function fu(q,u){return (q<=1&&/^(rebanadas|lonchas|latas|dientes)$/.test(u))?u.slice(0,-1):(u||'')}
function ingText(i){return i.q==null?'al gusto':(fq(i.q)+' '+fu(i.q,i.u)).trim()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

/* ============ ESTADO Y ALMACENAMIENTO ============ */
function seed(){
  const recipes=SEED.map((r,i)=>({id:'r'+(i+1),name:r[0],cat:r[1],time:r[2],diff:r[3],icon:r[4],fav:false,
    ing:r[5].split(';').map(s=>{const p=s.split(':');return {n:p[0],q:p[1]?+p[1]:null,u:p[2]||''}}),steps:r[6].slice()}));
  const plan=[0,1,2].map(w=>[0,1,2,3,4,5,6].map(d=>({d:'r'+(w*14+d*2+1),c:'r'+(w*14+d*2+2)})));
  return {v:1,recipes,plan,done:{},shop:{weeks:[true,true,true],have:{},bought:{},qty:{},extra:[]},theme:'auto',start:iso(monday(new Date()))};
}
function valid(o){return o&&Array.isArray(o.recipes)&&o.recipes.every(r=>r&&r.id&&r.name&&Array.isArray(r.ing)&&Array.isArray(r.steps))
  &&Array.isArray(o.plan)&&o.plan.length===3&&o.plan.every(w=>Array.isArray(w)&&w.length===7)}
function fix(o){const b=seed();o.done=o.done||{};o.shop=Object.assign(b.shop,o.shop||{});o.theme=o.theme||'auto';o.start=o.start||b.start;return o}
let storageOk=true;
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(valid(o))return fix(o)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false;toast('⚠️ No se pudo guardar en este navegador')}}
let S=load();
const U={view:'hoy',pw:0,pd:0,pf:'all',rf:'all',rs:''};
let M=null; // ventana abierta

const rec=id=>S.recipes.find(r=>r.id===id);
function curWeek(){const n=Math.round((monday(new Date())-parseIso(S.start))/6048e5);return ((n%3)+3)%3}
const todayIdx=()=>(new Date().getDay()+6)%7;
function setCurWeek(w){const m=monday(new Date());m.setDate(m.getDate()-w*7);S.start=iso(m)}
// Las marcas de "preparada" se asocian a la fecha de esa semana, así se limpian solas en el siguiente ciclo
function occ(w){const m=monday(new Date());m.setDate(m.getDate()+((w-curWeek()+3)%3)*7);return iso(m)}
const dk=(w,d,m)=>w+'-'+d+'-'+m;
const isDone=(w,d,m)=>S.done[dk(w,d,m)]===occ(w);
function applyTheme(){if(S.theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.theme}

/* ============ PIEZAS DE INTERFAZ ============ */
const chip=t=>`<span class="chip">${t}</span>`;
const meta=r=>`<div class="meta">${chip('⏱ '+esc(r.time)+' min')}${chip(esc(r.diff))}${chip(MEAL[r.cat])}</div>`;
function recipeFull(r){return `
  <div class="rhead"><div class="ricon">${esc(r.icon)}</div><div><h3>${esc(r.name)}</h3>${meta(r)}</div></div>
  <div class="rcols">
    <div><h4>Ingredientes <small>· para 2 personas</small></h4><ul class="ings">${r.ing.map(i=>`<li><span>${esc(i.n)}</span><b>${esc(ingText(i))}</b></li>`).join('')}</ul></div>
    <div><h4>Preparación</h4><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
  </div>`}
const slotAttr=(w,d,m)=>`data-w="${w}" data-d="${d}" data-m="${m}"`;
function doneBtn(w,d,m,cls=''){const on=isDone(w,d,m);return `<button class="btn ${cls} ${on?'ok':''}" data-a="done" ${slotAttr(w,d,m)}>${on?'✓ Preparada':'Marcar preparada'}</button>`}

function vHoy(){
  const w=curWeek(),d=todayIdx(),now=new Date();
  const fecha=now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  let n=0;for(let i=0;i<7;i++)for(const m of 'dc')if(isDone(w,i,m))n++;
  const card=m=>{const r=rec(S.plan[w][d][m]),on=isDone(w,d,m);
    return `<div class="card meal ${on?'done':''}"><span class="mlabel">${MEAL[m]}</span>${r?`
      <div class="rhead"><div class="ricon">${esc(r.icon)}</div><div><h3>${esc(r.name)}</h3><div class="meta">${chip('⏱ '+esc(r.time)+' min')}${chip(esc(r.diff))}</div></div></div>
      <div class="row"><button class="btn pri" data-a="open" data-id="${r.id}" ${slotAttr(w,d,m)}>Ver receta</button>${doneBtn(w,d,m)}</div>`
      :`<p class="sub">Sin receta asignada.</p><button class="btn pri" data-a="change" ${slotAttr(w,d,m)}>Elegir receta</button>`}</div>`};
  const t=(d+1)%7,tw=d===6?(w+1)%3:w;
  const mini=m=>{const r=rec(S.plan[tw][t][m]);return r?`<button class="mini" data-a="open" data-id="${r.id}" ${slotAttr(tw,t,m)}><span class="e">${esc(r.icon)}</span><span class="grow"><small class="sub">${MEAL[m]}</small><br>${esc(r.name)}</span>${chip('⏱ '+esc(r.time)+' min')}</button>`:''};
  return `<div class="hero">${COVER}<div class="herotxt"><span class="herotag">🥗 Nuestro Menú</span><h1>¿Qué comemos hoy?</h1><p>${esc(fecha.charAt(0).toUpperCase()+fecha.slice(1))} · Semana ${w+1} del menú</p></div></div>
  <div class="grid2" style="margin-top:20px">${card('d')}${card('c')}</div>
  <div class="grid2" style="margin-top:16px">
    <div class="card"><h4>Mañana · ${DAYS[t]}</h4>${mini('d')}${mini('c')}</div>
    <div class="card"><h4>Esta semana</h4><p><b>${n}</b> de 14 comidas preparadas</p><div class="prog"><i style="width:${n/14*100}%"></i></div>
      <div class="row" style="margin-top:16px"><button class="btn sm" data-a="nav" data-v="plan">📅 Ver planificador</button><button class="btn sm" data-a="nav" data-v="compra">🛒 Lista de compra</button></div></div>
  </div>`}

function vPlan(){
  const w=U.pw,d=U.pd,cw=curWeek(),ms=U.pf==='all'?['d','c']:[U.pf];
  const days=DAYS.map((n,i)=>{const day=S.plan[w][i];
    const ic=ms.map(m=>{const r=rec(day[m]);return r?esc(r.icon):'·'}).join(' ');
    const all=ms.every(m=>isDone(w,i,m));
    return `<button class="${i===d?'on':''} ${w===cw&&i===todayIdx()?'today':''}" data-a="day" data-d="${i}" aria-label="${n}">${n.slice(0,3)}<small>${all?'✓':ic}</small></button>`}).join('');
  const slots=ms.map(m=>{const r=rec(S.plan[w][d][m]);
    return `<section class="card slot ${isDone(w,d,m)?'done':''}"><div class="slotbar"><span class="mlabel">${MEAL[m]}</span><span class="grow"></span>
      <button class="btn sm" data-a="change" ${slotAttr(w,d,m)}>🔄 Cambiar</button>${r?doneBtn(w,d,m,'sm'):''}</div>
      ${r?recipeFull(r):'<p class="empty">Sin receta asignada. Pulsa «Cambiar» para elegir una.</p>'}</section>`}).join('');
  return `<h1>Planificador</h1><p class="sub">Elige semana y día para ver qué toca.</p>
  <div class="toolbar"><div class="seg">${[0,1,2].map(i=>`<button class="${i===w?'on':''}" data-a="week" data-w="${i}">Semana ${i+1}${i===cw?' · actual':''}</button>`).join('')}</div>
  <div class="seg">${[['all','Todo'],['d','Desayuno'],['c','Cena']].map(f=>`<button class="${U.pf===f[0]?'on':''}" data-a="pfilter" data-f="${f[0]}">${f[1]}</button>`).join('')}</div></div>
  <div class="days">${days}</div><h2 style="margin-top:8px">${DAYS[d]} · Semana ${w+1}</h2>${slots}`}

function recCards(){
  const q=norm(U.rs);
  const list=S.recipes.filter(r=>(U.rf==='all'||(U.rf==='fav'?r.fav:r.cat===U.rf))&&(!q||norm(r.name).includes(q)||r.ing.some(i=>norm(i.n).includes(q))));
  return list.length?list.map(r=>`<div class="card rc" data-a="open" data-id="${r.id}" tabindex="0" role="button">
    <div class="ricon">${esc(r.icon)}</div><h3 style="padding-right:30px">${esc(r.name)}</h3>${meta(r)}
    <button class="fav ${r.fav?'on':''}" data-a="fav" data-id="${r.id}" aria-label="Favorita">${r.fav?'★':'☆'}</button></div>`).join('')
  :'<p class="empty" style="grid-column:1/-1">No hay recetas que coincidan.</p>'}
function vRec(){return `<h1>Recetario</h1><p class="sub">${S.recipes.length} recetas · ${S.recipes.filter(r=>r.fav).length} favoritas</p>
  <div class="toolbar"><input type="search" id="recSearch" placeholder="Buscar receta o ingrediente…" value="${esc(U.rs)}" aria-label="Buscar">
  <button class="btn pri" data-a="new">＋ Añadir receta</button></div>
  <div class="seg">${[['all','Todas'],['d','Desayunos'],['c','Cenas'],['fav','★ Favoritas']].map(f=>`<button class="${U.rf===f[0]?'on':''}" data-a="rfilter" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>
  <div class="grid3" id="recGrid" style="margin-top:16px">${recCards()}</div>`}

const GROUPS=[['🍗 Carne y pescado',/sardin|atun/],['🫙 Despensa',/triturad|aceit|vinagre|sal\b|salsa|pimienta|pimenton|oregano|canela|miel|nuez|nueces|almendra|perejil/],
  ['🥬 Frutas y verduras',/tomate|pimiento|judia|espinaca|ensalada|lechuga|zanahoria|calabacin|cebolla|ajo|aguacate|limon|lima|fresa|platano|fruta|frutos|champi|patata/],
  ['🍗 Carne y pescado',/pollo|pavo|chuleta|jamoncito|atun|sardin|cerdo|ternera|salmon/],
  ['🥚 Huevos y lácteos',/huevo|yogur|queso|mozzarella|leche|feta/],
  ['🥖 Pan y cereales',/pan\b|tortilla|tortita|harina|noodle|arroz|avena|pasta/]];
const ORDER=['🥬 Frutas y verduras','🍗 Carne y pescado','🥚 Huevos y lácteos','🥖 Pan y cereales','🫙 Despensa','🧺 Otros'];
function groupOf(n){const s=norm(n);for(const g of GROUPS)if(g[1].test(s))return g[0];return '🧺 Otros'}
function shopItems(){
  const map=new Map();
  S.plan.forEach((wk,w)=>{if(!S.shop.weeks[w])return;wk.forEach(day=>{for(const m of 'dc'){const r=rec(day[m]);if(!r)continue;
    r.ing.forEach(i=>{if(!i.n)return;const k=norm(i.n)+'|'+(i.q==null?'':norm(i.u));let it=map.get(k);
      if(!it){it={k,n:i.n,u:i.u,q:i.q==null?null:0};map.set(k,it)}if(i.q!=null)it.q+=i.q})}})});
  const out=[...map.values()].map(it=>({k:it.k,n:it.n,def:it.q==null?'al gusto':/^(g|ml)$/.test(it.u)&&it.q>=1000?String(Math.round(it.q/10)/100).replace('.',',')+(it.u==='g'?' kg':' l'):(fq(it.q)+' '+fu(it.q,it.u)).trim()}));
  S.shop.extra.forEach(x=>out.push({k:'x'+x.id,n:x.n,def:x.q||'',extra:true}));
  return out.sort((a,b)=>a.n.localeCompare(b.n,'es'))}
function shopRow(it){const b=S.shop.bought[it.k],ov=!it.extra&&S.shop.qty[it.k]!=null,k=esc(it.k);
  return `<div class="srow ${b?'bought':''}"><button class="check" data-a="bought" data-k="${k}" aria-label="Marcar ${esc(it.n)} como comprado" aria-pressed="${!!b}">✓</button>
  <span class="sname">${esc(it.n)}</span>
  <input type="text" class="sqty ${ov?'ov':''}" data-c="qty" data-k="${k}" value="${esc(ov?S.shop.qty[it.k]:it.def)}" aria-label="Cantidad de ${esc(it.n)}">
  ${ov?`<button class="btn sm ic" data-a="qtyreset" data-k="${k}" title="Volver a la cantidad calculada">↺</button>`:''}
  ${it.extra?`<button class="btn sm ic warn" data-a="xdel" data-k="${k}" title="Quitar">✕</button>`
    :`<button class="btn sm ic ${S.shop.have[it.k]?'ok':''}" data-a="have" data-k="${k}" title="${S.shop.have[it.k]?'Volver a la lista':'Ya lo tenemos en casa'}">🏠</button>`}</div>`}
function vCompra(){
  const items=shopItems(),pend=items.filter(i=>!S.shop.have[i.k]),have=items.filter(i=>S.shop.have[i.k]);
  const nb=pend.filter(i=>S.shop.bought[i.k]).length;
  const groups={};pend.forEach(i=>{const g=i.extra?'🧺 Otros':groupOf(i.n);(groups[g]=groups[g]||[]).push(i)});
  return `<h1>Lista de compra</h1><p class="sub">Se calcula sumando los ingredientes de las semanas elegidas.</p>
  <div class="toolbar"><div class="seg">${[0,1,2].map(i=>`<button class="${S.shop.weeks[i]?'on':''}" data-a="sweek" data-w="${i}" aria-pressed="${S.shop.weeks[i]}">${S.shop.weeks[i]?'✓ ':''}Semana ${i+1}</button>`).join('')}</div>
  <span class="grow"></span><button class="btn sm" data-a="copy">📋 Copiar lista</button><button class="btn sm" data-a="clearb">Desmarcar comprados</button></div>
  <p class="sub" style="margin-bottom:14px"><b>${pend.length-nb}</b> por comprar · ${nb} comprados · ${have.length} en casa. Pulsa 🏠 si ya lo tenéis; la cantidad se puede editar.</p>
  ${pend.length?'':'<p class="empty card">No hay nada que comprar con esta selección.</p>'}
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">${ORDER.filter(g=>groups[g]).map(g=>`<div class="card"><p class="gtitle">${g}</p>${groups[g].map(shopRow).join('')}</div>`).join('')}</div>
  <h2>Añadir otro producto</h2>
  <div class="card row"><input type="text" id="xn" placeholder="Producto (p. ej. café)" style="flex:2;min-width:150px" aria-label="Producto">
    <input type="text" id="xq" placeholder="Cantidad" style="flex:1;min-width:100px" aria-label="Cantidad"><button class="btn pri" data-a="xadd">Añadir</button></div>
  ${have.length?`<h2>🏠 Ya tenemos en casa</h2><div class="card">${have.map(shopRow).join('')}</div>`:''}`}

function vAjustes(){const cw=curWeek();return `<h1>Ajustes</h1>
  <h2>Apariencia</h2><div class="card"><div class="seg">${[['auto','Automático'],['light','☀️ Claro'],['dark','🌙 Oscuro']].map(t=>`<button class="${S.theme===t[0]?'on':''}" data-a="theme" data-t="${t[0]}">${t[1]}</button>`).join('')}</div></div>
  <h2>¿En qué semana del menú estamos?</h2><div class="card"><p class="sub" style="margin-bottom:10px">El menú rota cada 3 semanas. Cambia aquí la semana actual si queréis empezar por otra.</p>
    <div class="seg">${[0,1,2].map(i=>`<button class="${i===cw?'on':''}" data-a="curweek" data-w="${i}">Semana ${i+1}</button>`).join('')}</div></div>
  <h2>Copia de seguridad</h2><div class="card"><p class="sub" style="margin-bottom:12px">Guarda todos vuestros datos (recetas, menú, lista de compra) en un archivo, o recupéralos desde uno.</p>
    <div class="row"><button class="btn pri" data-a="export">⬇️ Exportar datos (JSON)</button>
    <label class="btn" tabindex="0">⬆️ Importar datos<input type="file" accept=".json,application/json" data-c="import" hidden></label>
    <button class="btn warn" data-a="reset">Restablecer menú inicial</button></div></div>
  <h2>Privacidad</h2><div class="note">🔒 Todo se guarda únicamente en este navegador de vuestro ordenador${storageOk?'':' (⚠️ ahora mismo el navegador no permite guardar)'}. La aplicación no usa internet, cuentas ni servicios externos, y tiene bloqueada cualquier conexión de red.</div>`}

/* ============ VENTANAS (MODALES) ============ */
function mRecipe(){const r=rec(M.id);if(!r){M=null;return ''}const s=M.slot;
  return `<div class="mtop"><span class="mlabel">${s?DAYS[s.d]+' · '+MEAL[s.m]+' · Semana '+(s.w+1):'Receta'}</span><button class="btn sm ic" data-a="close" aria-label="Cerrar">✕</button></div>
  ${recipeFull(r)}
  <div class="row" style="margin-top:20px">${s?doneBtn(s.w,s.d,s.m)+`<button class="btn" data-a="change" ${slotAttr(s.w,s.d,s.m)}>🔄 Cambiar receta</button>`:''}
  <button class="btn ${r.fav?'ok':''}" data-a="fav" data-id="${r.id}">${r.fav?'★ Favorita':'☆ Favorita'}</button>
  <button class="btn" data-a="edit" data-id="${r.id}">✏️ Editar</button><button class="btn warn" data-a="del" data-id="${r.id}">🗑 Eliminar</button></div>`}
const ingRow=(i={})=>`<div class="ingrow"><input type="text" class="iq" placeholder="Cant." value="${i.q==null?'':esc(String(i.q).replace('.',','))}" aria-label="Cantidad">
  <input type="text" class="iu" list="units" placeholder="Unidad" value="${esc(i.u||'')}" aria-label="Unidad">
  <input type="text" class="in" placeholder="Ingrediente" value="${esc(i.n||'')}" aria-label="Ingrediente"><button type="button" class="btn sm ic" data-a="ingdel" aria-label="Quitar ingrediente">✕</button></div>`;
const EMO='🍳 🥚 🥗 🍗 🐟 🌯 🫓 🍞 🥑 🍅 🍄 🥔 🍜 🍕 🧀 🍓 🥣 🥩 🫑 🥪 🍲 🥦'.split(' ');
function mEdit(){const r=M.id?rec(M.id):{name:'',cat:'c',time:15,diff:'Fácil',icon:'🍲',ing:[{},{},{}],steps:[]};
  return `<div class="mtop"><h2 style="margin:0">${M.id?'Editar receta':'Nueva receta'}</h2><button class="btn sm ic" data-a="close" aria-label="Cerrar">✕</button></div>
  <label class="f" for="eName">Nombre</label><input type="text" id="eName" value="${esc(r.name)}">
  <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    <div><label class="f" for="eCat">Categoría</label><select id="eCat"><option value="d" ${r.cat==='d'?'selected':''}>Desayuno</option><option value="c" ${r.cat==='c'?'selected':''}>Cena</option></select></div>
    <div><label class="f" for="eTime">Tiempo (minutos)</label><input type="number" id="eTime" min="1" value="${esc(r.time)}"></div>
    <div><label class="f" for="eDiff">Dificultad</label><select id="eDiff">${['Fácil','Media','Difícil'].map(x=>`<option ${r.diff===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <label class="f">Icono</label><div class="emo" id="eEmo" data-v="${esc(r.icon)}">${EMO.map(e=>`<button type="button" class="${e===r.icon?'on':''}" data-a="emo" data-e="${e}">${e}</button>`).join('')}</div>
  <label class="f">Ingredientes para 2 personas <small class="sub">(deja la cantidad vacía para «al gusto»)</small></label>
  <div id="eIng">${r.ing.map(ingRow).join('')}</div><button type="button" class="btn sm" data-a="ingadd">＋ Ingrediente</button>
  <label class="f" for="eSteps">Preparación <small class="sub">(un paso por línea)</small></label><textarea id="eSteps">${esc(r.steps.join('\n'))}</textarea>
  <div class="row" style="margin-top:18px"><button class="btn pri grow" data-a="saverec">Guardar receta</button><button class="btn" data-a="close">Cancelar</button></div>`}
function pickList(){const q=norm(M.q||''),cur=S.plan[M.w][M.d][M.m];
  const l=S.recipes.filter(r=>(M.all||r.cat===M.m)&&(!q||norm(r.name).includes(q)));
  return l.length?l.map(r=>`<button class="mini" data-a="pick" data-id="${r.id}"><span class="e">${esc(r.icon)}</span><span class="grow">${esc(r.name)}${r.fav?' ★':''}<br><small class="sub">⏱ ${esc(r.time)} min · ${esc(r.diff)}${r.id===cur?' · <b>actual</b>':''}</small></span></button>`).join(''):'<p class="empty">Sin resultados.</p>'}
function mPick(){return `<div class="mtop"><div><h2 style="margin:0">Cambiar receta</h2><p class="sub">${DAYS[M.d]} · ${MEAL[M.m]} · Semana ${M.w+1}</p></div><button class="btn sm ic" data-a="close" aria-label="Cerrar">✕</button></div>
  <input type="search" id="pickSearch" placeholder="Buscar…" aria-label="Buscar receta">
  <label class="row" style="margin:12px 0"><input type="checkbox" data-c="pickall" ${M.all?'checked':''} style="width:22px;height:22px"> Mostrar también ${M.m==='d'?'las cenas':'los desayunos'}</label>
  <div class="card" id="pickList">${pickList()}</div>`}

/* ============ RENDER ============ */
const NAV=[['hoy','🏠','Hoy'],['plan','📅','Plan'],['rec','📖','Recetas'],['compra','🛒','Compra'],['ajustes','⚙️','Ajustes']];
const VIEWS={hoy:vHoy,plan:vPlan,rec:vRec,compra:vCompra,ajustes:vAjustes};
function renderModal(){const el=$('#modal');
  if(!M){el.innerHTML='';document.body.style.overflow='';return}
  const h=M.type==='recipe'?mRecipe():M.type==='edit'?mEdit():mPick();
  if(!M){el.innerHTML='';document.body.style.overflow='';return}
  el.innerHTML=`<div class="ov-bg" data-a="bgclose"><div class="modal" role="dialog" aria-modal="true">${h}</div></div>`;document.body.style.overflow='hidden'}
function render(){
  $('#nav').innerHTML=NAV.map(n=>`<button class="${U.view===n[0]?'on':''}" data-a="nav" data-v="${n[0]}"><span class="ni">${n[1]}</span>${n[2]}</button>`).join('');
  $('#main').innerHTML=VIEWS[U.view]();renderModal()}

/* ============ ACCIONES ============ */
const A={
  nav(d){U.view=d.v;if(d.v==='plan'){U.pw=curWeek();U.pd=todayIdx()}M=null;render();scrollTo(0,0)},
  week(d){U.pw=+d.w;render()}, day(d){U.pd=+d.d;render()}, pfilter(d){U.pf=d.f;render()}, rfilter(d){U.rf=d.f;render()},
  open(d){M={type:'recipe',id:d.id,slot:d.w!=null?{w:+d.w,d:+d.d,m:d.m}:null};renderModal()},
  close(){M=null;renderModal()},
  bgclose(d,e){if(e.target.classList.contains('ov-bg')&&(!M||M.type!=='edit')){M=null;renderModal()}},
  done(d){const k=dk(d.w,d.d,d.m);if(isDone(+d.w,+d.d,d.m))delete S.done[k];else S.done[k]=occ(+d.w);save();render()},
  fav(d){const r=rec(d.id);r.fav=!r.fav;save();render()},
  change(d){M={type:'pick',w:+d.w,d:+d.d,m:d.m,all:false,q:''};renderModal()},
  pick(d){S.plan[M.w][M.d][M.m]=d.id;save();M=null;render();toast('Receta cambiada')},
  new(){M={type:'edit',id:null};renderModal()},
  edit(d){M={type:'edit',id:d.id,back:M&&M.slot};renderModal()},
  del(d){const r=rec(d.id);if(!confirm('¿Eliminar «'+r.name+'»? Se quitará también del planificador.'))return;
    S.recipes=S.recipes.filter(x=>x.id!==d.id);S.plan.forEach(w=>w.forEach(day=>{for(const m of 'dc')if(day[m]===d.id)day[m]=null}));
    save();M=null;render();toast('Receta eliminada')},
  emo(d,e,el){const box=$('#eEmo');box.dataset.v=d.e;box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
  ingadd(){$('#eIng').insertAdjacentHTML('beforeend',ingRow());$('#eIng').lastElementChild.querySelector('.iq').focus()},
  ingdel(d,e,el){el.closest('.ingrow').remove()},
  saverec(){const name=$('#eName').value.trim();if(!name){toast('Escribe un nombre');$('#eName').focus();return}
    const ing=[...document.querySelectorAll('#eIng .ingrow')].map(row=>{const n=row.querySelector('.in').value.trim(),q=parseFloat(row.querySelector('.iq').value.replace(',','.'));
      return {n,q:isNaN(q)?null:q,u:row.querySelector('.iu').value.trim()}}).filter(i=>i.n);
    const steps=$('#eSteps').value.split('\n').map(s=>s.trim().replace(/^\d+[.)]\s*/,'')).filter(Boolean);
    const data={name,cat:$('#eCat').value,time:Math.max(1,parseInt($('#eTime').value)||10),diff:$('#eDiff').value,icon:$('#eEmo').dataset.v||'🍲',ing,steps};
    let id=M.id;if(id)Object.assign(rec(id),data);else{id=uid();S.recipes.push(Object.assign({id,fav:false},data))}
    save();M={type:'recipe',id,slot:M.back||null};render();toast('Receta guardada')},
  sweek(d){S.shop.weeks[+d.w]=!S.shop.weeks[+d.w];save();render()},
  bought(d){if(S.shop.bought[d.k])delete S.shop.bought[d.k];else S.shop.bought[d.k]=true;save();render()},
  have(d){if(S.shop.have[d.k])delete S.shop.have[d.k];else S.shop.have[d.k]=true;save();render()},
  qtyreset(d){delete S.shop.qty[d.k];save();render()},
  xadd(){const n=$('#xn').value.trim();if(!n){$('#xn').focus();return}S.shop.extra.push({id:uid(),n,q:$('#xq').value.trim()});save();render()},
  xdel(d){S.shop.extra=S.shop.extra.filter(x=>'x'+x.id!==d.k);delete S.shop.bought[d.k];save();render()},
  clearb(){S.shop.bought={};save();render()},
  copy(){const t=shopItems().filter(i=>!S.shop.have[i.k]&&!S.shop.bought[i.k]).map(i=>{const q=!i.extra&&S.shop.qty[i.k]!=null?S.shop.qty[i.k]:i.def;return '- '+i.n+(q?' ('+q+')':'')}).join('\n');
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();
    toast(ok?'Lista copiada':'No se pudo copiar')},
  theme(d){S.theme=d.t;applyTheme();save();render()},
  curweek(d){setCurWeek(+d.w);save();render();toast('Ahora estamos en la semana '+(+d.w+1))},
  export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
    a.download='nuestro-menu-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Archivo exportado')},
  reset(){if(!confirm('¿Restablecer el menú y las recetas iniciales? Se perderán vuestros cambios (exporta antes si quieres conservarlos).'))return;
    const th=S.theme;S=seed();S.theme=th;save();render();toast('Menú inicial restablecido')}
};
const C={
  qty(el){const k=el.dataset.k,v=el.value.trim();
    if(k[0]==='x'&&S.shop.extra.some(x=>'x'+x.id===k)){S.shop.extra.find(x=>'x'+x.id===k).q=v}
    else if(v)S.shop.qty[k]=v;else delete S.shop.qty[k];
    save();render()},
  pickall(el){M.all=el.checked;$('#pickList').innerHTML=pickList()},
  import(el){const f=el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!valid(o))throw 0;
      if(confirm('¿Sustituir todos los datos actuales por los del archivo?')){S=fix(o);applyTheme();save();render();toast('Datos importados')}}
      catch(e){toast('El archivo no es una copia válida de Nuestro Menú')}el.value=''};
    rd.readAsText(f)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset,e,el)});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.c;if(c&&C[c])C[c](e.target)});
document.addEventListener('input',e=>{
  if(e.target.id==='recSearch'){U.rs=e.target.value;$('#recGrid').innerHTML=recCards()}
  if(e.target.id==='pickSearch'){M.q=e.target.value;$('#pickList').innerHTML=pickList()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&M){M=null;renderModal()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.rc,label.btn')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&(e.target.id==='xn'||e.target.id==='xq'))A.xadd()});

applyTheme();U.pw=curWeek();U.pd=todayIdx();save();render();
// Solo en la versión alojada (https): guarda la app en el móvil para que funcione sin conexión
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
